[project]
name = "archicad-mcp-aberto"
version = "0.1.0.dev0"
description = "Open source MCP server for Archicad, built on the official JSON API and the Tapir add-on."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "archicad-mcp-aberto contributors" }]
keywords = ["archicad", "bim", "mcp", "tapir", "ai"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "mcp>=1.30,<2",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
]

[project.scripts]
archicad-mcp-aberto = "archicad_mcp_aberto.server:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archicad_mcp_aberto"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
markers = ["live: needs a running Archicad on this machine (run with -m live)"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
