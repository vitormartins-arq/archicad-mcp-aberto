name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Tag must match the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv build
      - name: Package revision-derived distribution
        run: |
          mkdir -p build
          npx -y @anthropic-ai/mcpb@2.1.2 pack . "build/server.mcpb"
          uv run python tools/distribution.py stage bundle --input build/server.mcpb --output dist
          uv run python tools/distribution.py source server_source --output dist
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --draft --generate-notes --title "$GITHUB_REF_NAME"
