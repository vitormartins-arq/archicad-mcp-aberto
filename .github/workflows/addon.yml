name: Add-on

on:
  pull_request:
    paths: ["addon/**", "tools/distribution.py", "distribution.json", "tests/unit/test_distribution.py", ".github/workflows/addon.yml"]
  push:
    branches: [main]
    paths: ["addon/**", "tools/distribution.py", "distribution.json", "tests/unit/test_distribution.py", ".github/workflows/addon.yml"]

jobs:
  build_win:
    # Builds with the MDID defaults in addon/CMakeLists.txt, so the artifact loads in Archicad.
    strategy:
      fail-fast: false
      matrix:
        params:
          - acVersion: 29
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/29.3000/API.Development.Kit.WIN.29.3000.zip
          - acVersion: 30
            devKitUrl: https://github.com/GRAPHISOFT/archicad-api-devkit/releases/download/30.3000/API.Development.Kit.WIN.30.3000.zip
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check distribution contract
        run: python -m unittest discover -s tests/unit -p test_distribution.py
      - name: Changed material requires a newer revision
        if: github.event_name == 'pull_request'
        run: python tools/distribution.py check --base "${{ github.event.pull_request.base.sha }}"
      - name: Download Development Kit
        run: python addon/Tools/download_and_unzip.py ${{ matrix.params.devKitUrl }} addon/devkit/AC${{ matrix.params.acVersion }}
      - name: Generate project
        run: cmake -B addon/build -G "Visual Studio 17 2022" -A "x64" -T "v143" -DAC_VERSION=${{ matrix.params.acVersion }} -DAC_API_DEVKIT_DIR="addon/devkit/AC${{ matrix.params.acVersion }}/Support" addon
      - name: Build
        run: cmake --build addon/build --config RelWithDebInfo
      - name: Package revision-derived files
        run: |
          python tools/distribution.py stage addon --input "addon/build/RelWithDebInfo/ArchicadMcpAberto_AC${{ matrix.params.acVersion }}_Win.apx" --archicad ${{ matrix.params.acVersion }} --output packages
          python tools/distribution.py source server_source --archicad ${{ matrix.params.acVersion }} --output packages
      - uses: actions/upload-artifact@v4
        with:
          name: ArchicadMcpAberto AC${{ matrix.params.acVersion }} Win
          path: packages/Archicad ${{ matrix.params.acVersion }}/*
